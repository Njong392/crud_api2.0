services:
  app:
    build:
      context: .
    ports:
      - 9000:80
    depends_on:
      - database
    env_file:
      - .env.docker
    develop:
      watch:
        - action: sync
          path: .
          target: /var/www/html
    volumes:
      - .:/var/www/html

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_USER: ${DATABASE_USER}
    volumes:
      - db_data:/var/lib/mysql
    expose:
      - 3306:3306

volumes:
  db_data:
